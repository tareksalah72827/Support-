  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>حديث - لوحة الإدارة</title>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind for quick styling (يمكنك استخدام CSS مخصص بدلاً منه) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- خط عربي مناسب -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Tajawal', sans-serif; }
    body { background-color: #0a3b2e; } /* أخضر عميق */
    .gold { color: #d4af37; }
    .bg-gold { background-color: #d4af37; }
    .border-gold { border-color: #d4af37; }
    .ticket-number { color: #d4af37; font-weight: bold; }
    .card { background: #ffffff10; backdrop-filter: blur(10px); border-radius: 20px; padding: 1.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .btn { padding: 0.75rem 1.5rem; border-radius: 40px; font-weight: 600; transition: 0.2s; border: none; cursor: pointer; }
    .btn-primary { background-color: #d4af37; color: #0a3b2e; }
    .btn-primary:hover { background-color: #c6a229; }
    .btn-outline { background: transparent; border: 2px solid #d4af37; color: #d4af37; }
    .btn-outline:hover { background: #d4af37; color: #0a3b2e; }
    .chat-message-user { background-color: #1e5a4c; color: white; border-radius: 20px 20px 0 20px; padding: 10px 15px; max-width: 80%; align-self: flex-end; }
    .chat-message-admin { background-color: #d4af37; color: #0a3b2e; border-radius: 20px 20px 20px 0; padding: 10px 15px; max-width: 80%; align-self: flex-start; }
    .ticket-item { background: #1a4e3f; border-radius: 15px; padding: 1rem; margin-bottom: 0.75rem; cursor: pointer; transition: 0.2s; border-right: 4px solid transparent; }
    .ticket-item:hover { background: #236b56; }
    .ticket-item.new { border-right-color: #d4af37; }
    .ticket-item.open { border-right-color: #22c55e; }
    .ticket-item.closed { border-right-color: #6b7280; opacity: 0.7; }
    /* تجاوب كامل */
    @media (max-width: 640px) {
      .card { padding: 1rem; }
    }
  </style>
</head>
<body class="min-h-screen p-4 text-white">

<div id="app" class="max-w-7xl mx-auto" dir="rtl">
  <!-- شاشة تسجيل الدخول (الكود السري) -->
  <div id="login-screen" class="flex items-center justify-center min-h-screen">
    <div class="card w-full max-w-md">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold gold">حديث</h1>
        <p class="text-gray-300">لوحة الإدارة</p>
      </div>
      <div class="mb-4">
        <label class="block text-sm mb-2">الكود السري</label>
        <input type="password" id="admin-code" class="w-full p-3 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/50" placeholder="أدخل الكود">
      </div>
      <button onclick="checkAdminCode()" class="btn btn-primary w-full">دخول</button>
      <p id="login-error" class="text-red-400 text-sm mt-2 text-center"></p>
    </div>
  </div>

  <!-- لوحة التحكم (تظهر بعد الدخول الصحيح) -->
  <div id="dashboard" style="display: none;">
    <!-- رأس الصفحة -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold gold">مرحباً أيها المدير</h1>
      <button onclick="logout()" class="btn btn-outline text-sm py-2 px-4">تسجيل خروج</button>
    </div>

    <!-- إحصائيات سريعة -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="card text-center">
        <div class="text-3xl font-bold gold" id="stats-new">0</div>
        <div class="text-sm">تذاكر جديدة</div>
      </div>
      <div class="card text-center">
        <div class="text-3xl font-bold gold" id="stats-open">0</div>
        <div class="text-sm">مفتوحة</div>
      </div>
      <div class="card text-center">
        <div class="text-3xl font-bold gold" id="stats-closed">0</div>
        <div class="text-sm">مغلقة</div>
      </div>
    </div>

    <!-- تبويبات التذاكر -->
    <div class="flex gap-2 mb-4 flex-wrap">
      <button onclick="filterTickets('new')" class="btn btn-outline py-2 px-4 text-sm" id="filter-new">الجديدة</button>
      <button onclick="filterTickets('open')" class="btn btn-outline py-2 px-4 text-sm" id="filter-open">المفتوحة</button>
      <button onclick="filterTickets('closed')" class="btn btn-outline py-2 px-4 text-sm" id="filter-closed">المغلقة</button>
    </div>

    <!-- قائمة التذاكر + نافذة الدردشة -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- قائمة التذاكر -->
      <div class="lg:col-span-1 card h-[70vh] overflow-y-auto">
        <h2 class="text-xl font-bold gold mb-4">التذاكر</h2>
        <div id="tickets-list" class="space-y-2">
          <!-- سيتم ملؤها ديناميكياً -->
        </div>
      </div>

      <!-- نافذة الدردشة للتذكرة المحددة -->
      <div class="lg:col-span-2 card h-[70vh] flex flex-col">
        <div id="chat-header" class="border-b border-white/20 pb-2 mb-2 flex justify-between items-center">
          <span id="selected-ticket-info" class="font-bold">اختر تذكرة لبدء المحادثة</span>
          <span id="ticket-expiry" class="text-sm text-gray-400"></span>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 px-1" style="min-height:0">
          <!-- الرسائل -->
        </div>
        <div id="chat-input-area" class="mt-2 flex gap-2 items-center" style="display: none;">
          <input type="text" id="message-input" placeholder="اكتب ردك..." class="flex-1 p-3 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/50">
          <button onclick="sendMessage()" class="btn btn-primary py-3 px-5">إرسال</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // إعداد Supabase
  const SUPABASE_URL = 'https://ldyconhionbdfdpbfvoy.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_na1XVf8d8lmZ47eW1VxWRQ__xsJI1rd';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // الحالة العامة
  let currentFilter = 'new';
  let tickets = [];
  let selectedTicket = null;
  let messagesSubscription = null;

  // عناصر DOM
  const loginScreen = document.getElementById('login-screen');
  const dashboard = document.getElementById('dashboard');
  const ticketsListEl = document.getElementById('tickets-list');
  const chatMessagesEl = document.getElementById('chat-messages');
  const chatHeader = document.getElementById('selected-ticket-info');
  const ticketExpiry = document.getElementById('ticket-expiry');
  const chatInputArea = document.getElementById('chat-input-area');
  const statsNew = document.getElementById('stats-new');
  const statsOpen = document.getElementById('stats-open');
  const statsClosed = document.getElementById('stats-closed');

  // التحقق من الكود السري (مخزن محلياً)
  function checkAdminCode() {
    const code = document.getElementById('admin-code').value;
    if (code === 'H2311') {
      sessionStorage.setItem('admin_authenticated', 'true');
      showDashboard();
    } else {
      document.getElementById('login-error').innerText = '❌ الكود غير صحيح';
    }
  }

  function showDashboard() {
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    loadTickets();
    subscribeToNewTickets();
  }

  function logout() {
    sessionStorage.removeItem('admin_authenticated');
    loginScreen.style.display = 'flex';
    dashboard.style.display = 'none';
    if (messagesSubscription) messagesSubscription.unsubscribe();
  }

  // التحقق من الجلسة عند تحميل الصفحة
  (function init() {
    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      showDashboard();
    }
  })();

  // تحميل جميع التذاكر مع الإحصائيات
  async function loadTickets() {
    const { data, error } = await supabase
      .from('tickets')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) console.error(error);
    else {
      tickets = data;
      updateStats();
      renderTickets();
    }
  }

  function updateStats() {
    const newCount = tickets.filter(t => t.status === 'new').length;
    const openCount = tickets.filter(t => t.status === 'open').length;
    const closedCount = tickets.filter(t => t.status === 'closed').length;
    statsNew.innerText = newCount;
    statsOpen.innerText = openCount;
    statsClosed.innerText = closedCount;
  }

  function renderTickets() {
    const filtered = tickets.filter(t => t.status === currentFilter);
    ticketsListEl.innerHTML = '';
    if (filtered.length === 0) {
      ticketsListEl.innerHTML = '<p class="text-gray-400 text-center py-4">لا توجد تذاكر</p>';
      return;
    }
    filtered.forEach(ticket => {
      const div = document.createElement('div');
      div.className = `ticket-item ${ticket.status}`;
      div.setAttribute('data-id', ticket.id);
      div.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="ticket-number text-lg">${ticket.ticket_number}</span>
          <span class="text-xs bg-black/20 px-2 py-1 rounded-full">${ticket.category}</span>
        </div>
        <div class="text-sm mt-1">${ticket.user_name}</div>
        <div class="text-xs text-gray-300 mt-1">${new Date(ticket.created_at).toLocaleString('ar-EG')}</div>
      `;
      div.onclick = () => selectTicket(ticket);
      ticketsListEl.appendChild(div);
    });
  }

  function filterTickets(status) {
    currentFilter = status;
    renderTickets();
  }

  // اختيار تذكرة لعرض الدردشة
  async function selectTicket(ticket) {
    selectedTicket = ticket;
    chatHeader.innerText = `تذكرة: ${ticket.ticket_number} - ${ticket.user_name}`;
    const expiry = new Date(ticket.expires_at).toLocaleString('ar-EG');
    ticketExpiry.innerText = `تنتهي: ${expiry}`;
    chatInputArea.style.display = 'flex';

    // تحميل الرسائل
    await loadMessages(ticket.id);

    // الاشتراك في الرسائل الجديدة لهذه التذكرة
    if (messagesSubscription) messagesSubscription.unsubscribe();
    messagesSubscription = supabase
      .channel('messages-channel')
      .on('postgres_changes', { 
        event: 'INSERT', 
        schema: 'public', 
        table: 'messages',
        filter: `ticket_id=eq.${ticket.id}`
      }, payload => {
        appendMessage(payload.new);
      })
      .subscribe();
  }

  async function loadMessages(ticketId) {
    const { data, error } = await supabase
      .from('messages')
      .select('*')
      .eq('ticket_id', ticketId)
      .order('created_at', { ascending: true });
    if (error) console.error(error);
    else {
      chatMessagesEl.innerHTML = '';
      data.forEach(msg => appendMessage(msg));
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }
  }

  function appendMessage(msg) {
    const div = document.createElement('div');
    div.className = msg.sender === 'admin' ? 'chat-message-admin' : 'chat-message-user';
    div.innerText = msg.message;
    chatMessagesEl.appendChild(div);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  // إرسال رسالة من المدير
  async function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text || !selectedTicket) return;

    // إذا كانت التذكرة منتهية الصلاحية، نمنع الإرسال
    if (new Date(selectedTicket.expires_at) < new Date()) {
      alert('انتهت صلاحية هذه التذكرة، لا يمكن الرد.');
      return;
    }

    // تغيير حالة التذكرة إلى open إذا كانت new
    if (selectedTicket.status === 'new') {
      await supabase
        .from('tickets')
        .update({ status: 'open' })
        .eq('id', selectedTicket.id);
      selectedTicket.status = 'open';
      updateStats();
      renderTickets();
    }

    const { error } = await supabase
      .from('messages')
      .insert({
        ticket_id: selectedTicket.id,
        sender: 'admin',
        message: text
      });
    if (error) console.error(error);
    else {
      input.value = '';
    }
  }

  // الاشتراك في التذاكر الجديدة (لإشعار المدير)
  function subscribeToNewTickets() {
    supabase
      .channel('tickets-channel')
      .on('postgres_changes', { 
        event: 'INSERT', 
        schema: 'public', 
        table: 'tickets' 
      }, payload => {
        // إشعار صوتي بسيط (اختياري)
        const audio = new Audio('data:audio/wav;base64,UklGRlwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVgAAABhZm9j'); // صوت قصير
        audio.play().catch(e => {}); // بعض المتصفحات تمنع الصوت التلقائي

        // إعادة تحميل التذاكر
        loadTickets();
        // عرض إشعار في الواجهة
        alert(`تذكرة جديدة: ${payload.new.ticket_number}`);
      })
      .subscribe();
  }
</script>
</body>
</html>
